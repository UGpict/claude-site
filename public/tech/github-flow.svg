<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" role="img" aria-label="GitHubへの流れと、上げてはいけないもの。手元でコミットしてプッシュするとGitHubに上がる。秘密（.envや鍵ファイル）は.gitignoreで除外し、環境変数で渡す。">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">GitHub への流れと「上げないもの」</text>

  <defs>
    <marker id="gh-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/>
    </marker>
  </defs>

  <!-- local -->
  <rect x="40" y="64" width="230" height="80" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="155" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">手元のパソコン</text>
  <text x="155" y="122" text-anchor="middle" font-size="11" fill="#334155">ここで作業する</text>

  <!-- arrow with labels -->
  <line x1="272" y1="104" x2="446" y2="104" stroke="#2337ff" stroke-width="2" marker-end="url(#gh-arrow)"/>
  <text x="360" y="94" text-anchor="middle" font-size="12" fill="#334155" font-family="monospace">commit → push</text>

  <!-- github -->
  <rect x="450" y="64" width="230" height="80" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="565" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">GitHub</text>
  <text x="565" y="122" text-anchor="middle" font-size="11" fill="#334155">保存・公開される</text>

  <!-- warning: do not upload -->
  <rect x="40" y="166" width="640" height="66" rx="12" fill="#fff5f5" stroke="#e0554e" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#b23b34">秘密は上げない：.env ・ API キー ・ 鍵ファイル(.json) ・ 個人情報</text>
  <text x="360" y="214" text-anchor="middle" font-size="12" fill="#b23b34">.gitignore で除外する／環境変数で渡す</text>
</svg>
