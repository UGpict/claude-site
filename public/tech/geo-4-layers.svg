<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">AI に引用されるための 4 つの工夫</text>

  <!-- 層A -->
  <rect x="70" y="74" width="580" height="60" rx="12" fill="#eef1ff" stroke="#2337ff"/>
  <rect x="86" y="88" width="32" height="32" rx="8" fill="#2337ff"/>
  <text x="102" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">A</text>
  <text x="134" y="100" font-size="16" font-weight="700" fill="#000d8a">機械が読める「名札」</text>
  <text x="134" y="121" font-size="12.5" fill="#334155">「これは何の情報か」を AI に伝える</text>

  <!-- 層B -->
  <rect x="70" y="154" width="580" height="60" rx="12" fill="#eef1ff" stroke="#2337ff"/>
  <rect x="86" y="168" width="32" height="32" rx="8" fill="#2337ff"/>
  <text x="102" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">B</text>
  <text x="134" y="180" font-size="16" font-weight="700" fill="#000d8a">抜き出されやすい書き方</text>
  <text x="134" y="201" font-size="12.5" fill="#334155">結論先出し・表・質問形の見出し</text>

  <!-- 層C -->
  <rect x="70" y="234" width="580" height="60" rx="12" fill="#e9f6ec" stroke="#3f9e5a"/>
  <rect x="86" y="248" width="32" height="32" rx="8" fill="#3f9e5a"/>
  <text x="102" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">C</text>
  <text x="134" y="260" font-size="16" font-weight="700" fill="#2f7d46">自分だけの一次情報</text>
  <text x="134" y="281" font-size="12.5" fill="#334155">現場の情報こそ AI が引用したがる</text>

  <!-- 層D -->
  <rect x="70" y="314" width="580" height="60" rx="12" fill="#eef1f6" stroke="#64748b"/>
  <rect x="86" y="328" width="32" height="32" rx="8" fill="#64748b"/>
  <text x="102" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">D</text>
  <text x="134" y="340" font-size="16" font-weight="700" fill="#334155">見せ方をそろえる</text>
  <text x="134" y="361" font-size="12.5" fill="#334155">タイトル・URL の整合</text>
</svg>
