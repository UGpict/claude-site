<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" role="img" aria-label="公開後に検索エンジンへ知らせる流れ">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1219">公開したら、検索エンジンに知らせる</text>
  <defs><marker id="sc" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker></defs>

  <g>
    <rect x="15" y="80" width="150" height="82" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="90" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">記事を公開</text>
    <text x="90" y="138" text-anchor="middle" font-size="11" fill="#64748b">これだけでは</text>
    <text x="90" y="153" text-anchor="middle" font-size="11" fill="#64748b">まだ検索に出ない</text>
  </g>
  <line x1="168" y1="121" x2="192" y2="121" stroke="#2337ff" stroke-width="2.5" marker-end="url(#sc)"/>

  <g>
    <rect x="195" y="80" width="150" height="82" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="270" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">サイトマップ送信</text>
    <text x="270" y="138" text-anchor="middle" font-size="11" fill="#64748b">サイト全体を</text>
    <text x="270" y="153" text-anchor="middle" font-size="11" fill="#64748b">まとめて知らせる</text>
  </g>
  <line x1="348" y1="121" x2="372" y2="121" stroke="#2337ff" stroke-width="2.5" marker-end="url(#sc)"/>

  <g>
    <rect x="375" y="80" width="150" height="82" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">URL 検査</text>
    <text x="450" y="138" text-anchor="middle" font-size="11" fill="#64748b">読んでほしい一本を</text>
    <text x="450" y="153" text-anchor="middle" font-size="11" fill="#64748b">個別にお願い</text>
  </g>
  <line x1="528" y1="121" x2="552" y2="121" stroke="#2337ff" stroke-width="2.5" marker-end="url(#sc)"/>

  <g>
    <rect x="555" y="80" width="150" height="82" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <text x="630" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">インデックス</text>
    <text x="630" y="138" text-anchor="middle" font-size="11" fill="#33553f">検索結果に</text>
    <text x="630" y="153" text-anchor="middle" font-size="11" fill="#33553f">載る</text>
  </g>

  <text x="360" y="205" text-anchor="middle" font-size="13" fill="#64748b">送ったあとは、焦らず待つ（登録まで数日〜数週間かかることも）</text>
</svg>
