<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="sans-serif" role="img" aria-label="MCPで調べて使うがひとつづきになる。AIがMCPサーバー経由で外部サービスにつなぎ、結果を受け取って作業に活かす。">
  <rect width="720" height="200" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">「調べて、使う」がひとつづきに</text>
  <defs>
    <marker id="mf-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>
  <rect x="24" y="86" width="150" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="99" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">AI</text>
  <text x="99" y="134" text-anchor="middle" font-size="11" fill="#64748b">Claude など</text>

  <line x1="176" y1="116" x2="210" y2="116" stroke="#2337ff" stroke-width="2" marker-end="url(#mf-arrow)"/>

  <rect x="214" y="86" width="180" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="304" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">MCP サーバー</text>
  <text x="304" y="132" text-anchor="middle" font-size="11" fill="#64748b">共通の差込口</text>

  <line x1="396" y1="116" x2="430" y2="116" stroke="#2337ff" stroke-width="2" marker-end="url(#mf-arrow)"/>

  <rect x="434" y="86" width="180" height="60" rx="12" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="524" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">外部サービス</text>
  <text x="524" y="132" text-anchor="middle" font-size="11" fill="#64748b">ファイル・カレンダー等</text>

  <line x1="616" y1="116" x2="650" y2="116" stroke="#2337ff" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <text x="672" y="120" text-anchor="middle" font-size="12" fill="#2f7d46">結果</text>
</svg>
