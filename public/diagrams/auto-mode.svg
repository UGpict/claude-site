<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" role="img" aria-label="autoモードの分かれ道。ふつうの作業はそのまま進み、取り返しのつかない・破壊的・環境の外に向かう操作だけ確認で止まる。">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">auto モードの「分かれ道」</text>

  <defs>
    <marker id="am-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/>
    </marker>
    <marker id="am-arrow-g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#3f9e5a"/>
    </marker>
    <marker id="am-arrow-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#e0554e"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="24" y="98" width="170" height="56" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="109" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">AI がやろうと</text>
  <text x="109" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">する操作</text>

  <line x1="196" y1="126" x2="250" y2="126" stroke="#2337ff" stroke-width="2" marker-end="url(#am-arrow)"/>

  <!-- diamond-ish check -->
  <rect x="254" y="92" width="150" height="68" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="329" y="120" text-anchor="middle" font-size="12" fill="#334155">危ない操作？</text>
  <text x="329" y="140" text-anchor="middle" font-size="11" fill="#64748b">取り返しつく？</text>

  <!-- to proceed (no) -->
  <line x1="404" y1="110" x2="500" y2="80" stroke="#3f9e5a" stroke-width="2" marker-end="url(#am-arrow-g)"/>
  <text x="452" y="82" text-anchor="middle" font-size="10" fill="#2f7d46">いいえ</text>
  <rect x="504" y="56" width="192" height="52" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2f7d46">そのまま進む</text>
  <text x="600" y="98" text-anchor="middle" font-size="10" fill="#64748b">確認なしで自動</text>

  <!-- to stop (yes) -->
  <line x1="404" y1="142" x2="500" y2="172" stroke="#e0554e" stroke-width="2" marker-end="url(#am-arrow-r)"/>
  <text x="452" y="176" text-anchor="middle" font-size="10" fill="#b23b34">はい</text>
  <rect x="504" y="146" width="192" height="52" rx="10" fill="#fff5f5" stroke="#e0554e" stroke-width="2"/>
  <text x="600" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#b23b34">止まって確認</text>
  <text x="600" y="188" text-anchor="middle" font-size="10" fill="#64748b">破壊的・環境の外</text>

  <text x="360" y="232" text-anchor="middle" font-size="12" fill="#64748b">ふつうの作業は自動で進み、危ない操作だけ人に確認を求める。</text>
</svg>
