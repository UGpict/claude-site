<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="sans-serif" role="img" aria-label="OWASPは危険を順位づけしたチェックリストを公開する非営利団体。AI版のLLM Top 10では、プロンプトインジェクションが1位。">
  <rect width="720" height="210" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">OWASP と AI 版の危険ランキング</text>

  <defs>
    <marker id="ow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/>
    </marker>
  </defs>

  <!-- OWASP -->
  <rect x="24" y="66" width="190" height="92" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="119" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#000d8a">OWASP</text>
  <text x="119" y="122" text-anchor="middle" font-size="11" fill="#334155">セキュリティの</text>
  <text x="119" y="138" text-anchor="middle" font-size="11" fill="#334155">非営利団体</text>

  <line x1="216" y1="112" x2="256" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#ow-arrow)"/>

  <!-- LLM Top 10 -->
  <rect x="264" y="66" width="190" height="92" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="359" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">AI 版の危険</text>
  <text x="359" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">ランキング</text>
  <text x="359" y="140" text-anchor="middle" font-size="11" fill="#334155">「LLM Top 10」</text>

  <line x1="456" y1="112" x2="496" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#ow-arrow)"/>

  <!-- #1 prompt injection -->
  <rect x="504" y="66" width="192" height="92" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="600" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">1 位</text>
  <text x="600" y="118" text-anchor="middle" font-size="12" fill="#2f7d46">プロンプト</text>
  <text x="600" y="134" text-anchor="middle" font-size="12" fill="#2f7d46">インジェクション</text>

  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#64748b">Web アプリ版の「Top 10」でも世界的に有名。その AI 版が「LLM Top 10」。</text>
</svg>
