<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" role="img" aria-label="伝わるプロンプトの4つの部品。役割・依頼・条件・出力形式をそろえると、ねらった答えが返ってきやすくなる。">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">伝わるプロンプトの4部品</text>
  <defs>
    <marker id="p4-arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="30" y="70" width="150" height="52" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="105" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">役割</text>
  <text x="105" y="114" text-anchor="middle" font-size="11" fill="#64748b">誰として答える？</text>

  <rect x="30" y="132" width="150" height="52" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="105" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">依頼</text>
  <text x="105" y="176" text-anchor="middle" font-size="11" fill="#64748b">何をしてほしい？</text>

  <rect x="200" y="70" width="150" height="52" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="275" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">条件</text>
  <text x="275" y="114" text-anchor="middle" font-size="11" fill="#64748b">字数・相手・トーン</text>

  <rect x="200" y="132" width="150" height="52" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="275" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">出力形式</text>
  <text x="275" y="176" text-anchor="middle" font-size="11" fill="#64748b">箇条書き・表など</text>

  <line x1="356" y1="128" x2="410" y2="128" stroke="#2337ff" stroke-width="2.5" marker-end="url(#p4-arrow)"/>

  <rect x="418" y="88" width="272" height="76" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2.5"/>
  <text x="554" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#2f7d46">ねらった答え</text>
  <text x="554" y="146" text-anchor="middle" font-size="12" fill="#334155">やり直しが減る</text>

  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#64748b">全部そろえなくてもOK。足すほど伝わりやすくなる。</text>
</svg>
