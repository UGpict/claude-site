<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="sans-serif" role="img" aria-label="3つの違い。メモリーは覚えていること、Skillsはやり方、CLAUDE.mdはいつもの常識。">
  <rect width="720" height="210" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">メモリー・Skills・CLAUDE.md</text>
  <g>
    <rect x="30" y="66" width="200" height="112" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="130" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">メモリー</text>
    <text x="130" y="128" text-anchor="middle" font-size="12" fill="#334155">覚えていること</text>
    <text x="130" y="152" text-anchor="middle" font-size="11" fill="#64748b">あなたや決めごと</text>
  </g>
  <g>
    <rect x="260" y="66" width="200" height="112" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
