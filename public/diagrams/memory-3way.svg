  </g>
  <g>
    <rect x="490" y="66" width="200" height="112" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <text x="590" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">CLAUDE.md</text>
    <text x="590" y="128" text-anchor="middle" font-size="12" fill="#334155">いつもの常識</text>
    <text x="590" y="152" text-anchor="middle" font-size="11" fill="#64748b">毎回かならず読む</text>
  </g>
