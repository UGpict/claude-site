<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="sans-serif" role="img" aria-label="自動化は3段階。手動リレー（人がコピペ）、半自動（手順をテンプレ化）、自動（AIが自分で道具を呼ぶ）。進むほど人の手間が減る。">
  <rect width="720" height="230" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">自動化は3段階</text>
  <defs>
    <marker id="j3-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="24" y="70" width="196" height="86" rx="12" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="122" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">手動リレー</text>
  <text x="122" y="126" text-anchor="middle" font-size="11" fill="#64748b">人がコピペで</text>
  <text x="122" y="144" text-anchor="middle" font-size="11" fill="#64748b">つなぐ</text>

  <line x1="224" y1="113" x2="256" y2="113" stroke="#2337ff" stroke-width="2" marker-end="url(#j3-arrow)"/>

  <rect x="262" y="70" width="196" height="86" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="360" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">半自動</text>
  <text x="360" y="126" text-anchor="middle" font-size="11" fill="#64748b">手順をテンプレ化・</text>
  <text x="360" y="144" text-anchor="middle" font-size="11" fill="#64748b">登録しておく</text>

  <line x1="462" y1="113" x2="494" y2="113" stroke="#2337ff" stroke-width="2" marker-end="url(#j3-arrow)"/>

  <rect x="500" y="70" width="196" height="86" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="598" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">自動</text>
  <text x="598" y="126" text-anchor="middle" font-size="11" fill="#64748b">AIが自分で</text>
  <text x="598" y="144" text-anchor="middle" font-size="11" fill="#64748b">道具・別AIを呼ぶ</text>

  <text x="122" y="196" text-anchor="middle" font-size="12" fill="#64748b">人の手間 多い</text>
  <line x1="200" y1="192" x2="520" y2="192" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="598" y="196" text-anchor="middle" font-size="12" fill="#64748b">人の手間 少ない</text>
</svg>
