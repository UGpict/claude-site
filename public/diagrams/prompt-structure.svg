<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="sans-serif" role="img" aria-label="よいプロンプトの構成">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">よいプロンプトの組み立て方</text>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="70" width="360" height="46" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="60" y="99" font-size="16" fill="#334155"><tspan font-weight="700" fill="#000d8a">役割</tspan>　あなたはプロの編集者です</text>
  </g>
  <g>
    <rect x="40" y="124" width="360" height="46" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="60" y="153" font-size="16" fill="#334155"><tspan font-weight="700" fill="#000d8a">条件</tspan>　初心者向け・300字以内で</text>
  </g>
  <g>
    <rect x="40" y="178" width="360" height="46" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="60" y="207" font-size="16" fill="#334155"><tspan font-weight="700" fill="#000d8a">お手本</tspan>　こんな文体で（例を添える）</text>
  </g>
  <g>
    <rect x="40" y="232" width="360" height="46" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="60" y="261" font-size="16" fill="#334155"><tspan font-weight="700" fill="#000d8a">形式</tspan>　箇条書きで出力して</text>
  </g>

  <line x1="410" y1="174" x2="470" y2="174" stroke="#2337ff" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <g>
    <rect x="484" y="128" width="196" height="92" rx="14" fill="#2337ff"/>
    <text x="582" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">ほしい答え</text>
    <text x="582" y="194" text-anchor="middle" font-size="13" fill="#dfe4ff">そのまま使える形で</text>
  </g>
</svg>
