<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">RAG ＝ 資料を見せてから答えさせる</text>

  <!-- 質問 -->
  <rect x="26" y="98" width="132" height="84" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="92" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">あなたの</text>
  <text x="92" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">質問</text>

  <!-- 検索 -->
  <rect x="192" y="92" width="150" height="96" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="267" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">自社の資料から</text>
  <text x="267" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">関連部分を検索</text>
  <text x="267" y="170" text-anchor="middle" font-size="11" fill="#2f7d46">Retrieval</text>

  <!-- AI -->
  <rect x="376" y="98" width="132" height="84" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="442" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">AI が読んで</text>
  <text x="442" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">答えを作る</text>

  <!-- 答え -->
  <rect x="542" y="92" width="152" height="96" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="618" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">資料に基づく</text>
  <text x="618" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">あなたの答え</text>

  <!-- 矢印 -->
  <line x1="158" y1="140" x2="188" y2="140" stroke="#2337ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="342" y1="140" x2="372" y2="140" stroke="#2337ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="508" y1="140" x2="538" y2="140" stroke="#2337ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="360" y="240" text-anchor="middle" font-size="13" fill="#64748b">資料を見せないと一般論。見せるほど、あなたの現場の答えに近づく</text>
</svg>
