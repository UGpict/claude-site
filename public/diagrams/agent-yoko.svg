<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="sans-serif" role="img" aria-label="横に広がる。同じ一つのAIが、Gmailでメールを読み、カレンダーに予定を入れ、Slackでチームに共有する。サービスをまたいで一続きに動く。">
  <rect width="720" height="210" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">一つのAIが、サービスをまたいで動く</text>
  <defs>
    <marker id="yk-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#64748b">担当するのは、ぜんぶ同じAI</text>

  <rect x="30" y="90" width="185" height="72" rx="12" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="122" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Gmail</text>
  <text x="122" y="144" text-anchor="middle" font-size="11" fill="#64748b">メールを読む</text>

  <line x1="217" y1="126" x2="253" y2="126" stroke="#2337ff" stroke-width="2" marker-end="url(#yk-arrow)"/>

  <rect x="267" y="90" width="185" height="72" rx="12" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="359" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">カレンダー</text>
  <text x="359" y="144" text-anchor="middle" font-size="11" fill="#64748b">予定を入れる</text>

  <line x1="454" y1="126" x2="490" y2="126" stroke="#2337ff" stroke-width="2" marker-end="url(#yk-arrow)"/>

  <rect x="504" y="90" width="185" height="72" rx="12" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="596" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Slack</text>
  <text x="596" y="144" text-anchor="middle" font-size="11" fill="#64748b">チームに共有する</text>
</svg>
