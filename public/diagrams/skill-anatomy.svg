<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" role="img" aria-label="SKILL.mdの中身。名前・説明（いつ使うか）・本文（手順やルール）の3つ。ファイルは.claude/skills/名前/SKILL.mdに置く。">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">スキルの中身（SKILL.md）</text>

  <!-- file card -->
  <rect x="150" y="60" width="420" height="184" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text x="170" y="86" font-size="12" font-family="monospace" fill="#64748b">SKILL.md</text>

  <!-- name -->
  <rect x="168" y="96" width="384" height="34" rx="8" fill="#eef1ff" stroke="#2337ff" stroke-width="1.5"/>
  <text x="184" y="118" font-size="13" font-weight="700" fill="#000d8a">名前</text>
  <text x="360" y="118" font-size="12" fill="#334155">このスキルの呼び名</text>

  <!-- description (highlighted) -->
  <rect x="168" y="136" width="384" height="46" rx="8" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="184" y="158" font-size="13" font-weight="700" fill="#2f7d46">説明</text>
  <text x="360" y="156" font-size="12" fill="#2f7d46">いつ使うか＝呼び出しの合図</text>
  <text x="360" y="173" font-size="11" fill="#64748b">ここがいちばん大事</text>

  <!-- body -->
  <rect x="168" y="188" width="384" height="42" rx="8" fill="#f5f5f5" stroke="#64748b" stroke-width="1.5"/>
  <text x="184" y="210" font-size="13" font-weight="700" fill="#334155">本文</text>
  <text x="360" y="210" font-size="12" fill="#334155">やり方・手順・守ること</text>

  <!-- path note -->
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#64748b">置き場所：</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" font-family="monospace" fill="#334155">.claude/skills/（名前）/SKILL.md</text>
</svg>
