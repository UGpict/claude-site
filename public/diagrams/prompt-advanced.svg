<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" role="img" aria-label="もう一歩AIの力を引き出す3つのコツ">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">もう一歩、AI の力を引き出す 3 つのコツ</text>

  <!-- card 1 -->
  <g>
    <rect x="30" y="80" width="200" height="180" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <circle cx="130" cy="118" r="18" fill="#2337ff"/>
    <text x="130" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">考える時間を与える</text>
    <text x="130" y="186" text-anchor="middle" font-size="12" fill="#334155">「順を追って考えて</text>
    <text x="130" y="204" text-anchor="middle" font-size="12" fill="#334155">から答えて」</text>
    <text x="130" y="234" text-anchor="middle" font-size="11" fill="#64748b">結論に飛びつかせない</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="260" y="80" width="200" height="180" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <circle cx="360" cy="118" r="18" fill="#2337ff"/>
    <text x="360" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="360" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">資料と指示を分ける</text>
    <text x="360" y="186" text-anchor="middle" font-size="12" fill="#334155">資料を先に、</text>
    <text x="360" y="204" text-anchor="middle" font-size="12" fill="#334155">頼みごとは最後に</text>
    <text x="360" y="234" text-anchor="middle" font-size="11" fill="#64748b">「― ここまでが資料 ―」</text>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="490" y="80" width="200" height="180" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <circle cx="590" cy="118" r="18" fill="#2337ff"/>
    <text x="590" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="590" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">最後に見直しを頼む</text>
    <text x="590" y="186" text-anchor="middle" font-size="12" fill="#334155">「自分で点検して</text>
    <text x="590" y="204" text-anchor="middle" font-size="12" fill="#334155">直して」</text>
    <text x="590" y="234" text-anchor="middle" font-size="11" fill="#64748b">数字や事実に効く</text>
  </g>
</svg>
