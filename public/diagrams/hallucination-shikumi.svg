<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="sans-serif" role="img" aria-label="ハルシネーションの仕組み。AIは質問に対して、もっともらしい文章を作る。たいていは正しいが、ときどき自信たっぷりに間違える。">
  <rect width="720" height="220" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">「それっぽい」けれど間違い</text>
  <defs>
    <marker id="hs-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="24" y="90" width="150" height="60" rx="12" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="99" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">質問</text>
  <text x="99" y="138" text-anchor="middle" font-size="11" fill="#64748b">あなたの問いかけ</text>

  <line x1="176" y1="120" x2="210" y2="120" stroke="#2337ff" stroke-width="2" marker-end="url(#hs-arrow)"/>

  <rect x="214" y="90" width="200" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="314" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">もっともらしい文</text>
  <text x="314" y="136" text-anchor="middle" font-size="11" fill="#64748b">自然な言葉を組み立てる</text>

  <line x1="416" y1="120" x2="450" y2="120" stroke="#2337ff" stroke-width="2" marker-end="url(#hs-arrow)"/>

  <rect x="454" y="76" width="236" height="40" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="572" y="101" text-anchor="middle" font-size="13" fill="#2f7d46">たいていは正しい</text>

  <rect x="454" y="124" width="236" height="40" rx="10" fill="#fff5f5" stroke="#e0554e" stroke-width="2"/>
  <text x="572" y="149" text-anchor="middle" font-size="13" fill="#b23b34">ときどき自信たっぷりに誤り</text>
</svg>
