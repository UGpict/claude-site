<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="sans-serif" role="img" aria-label="必要になってから一段ずつ上げる。無料で試す→足りなければPro→さらに足りなければMax。最初から高いプランを選ぶ必要はない。">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">必要になってから、一段ずつ</text>

  <defs>
    <marker id="up-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#3f9e5a"/>
    </marker>
  </defs>

  <!-- 無料 -->
  <rect x="40" y="176" width="180" height="56" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="130" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#2f7d46">無料</text>
  <text x="130" y="220" text-anchor="middle" font-size="11" fill="#64748b">まず試す</text>

  <line x1="224" y1="200" x2="256" y2="150" stroke="#3f9e5a" stroke-width="2" marker-end="url(#up-arrow)"/>

  <!-- Pro -->
  <rect x="270" y="118" width="180" height="56" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="360" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">Pro</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#64748b">足りなければ</text>

  <line x1="454" y1="142" x2="486" y2="92" stroke="#3f9e5a" stroke-width="2" marker-end="url(#up-arrow)"/>

  <!-- Max -->
  <rect x="500" y="60" width="180" height="56" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="590" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">Max</text>
  <text x="590" y="104" text-anchor="middle" font-size="11" fill="#64748b">さらに足りなければ</text>

  <text x="360" y="250" text-anchor="middle" font-size="12" fill="#64748b">最初から高いプランを選ぶ必要はない。</text>
</svg>
