<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="sans-serif" role="img" aria-label="評価の順番はdeny→ask→allow。禁止は最優先で、あとから許可で上書きされない。">
  <rect width="720" height="200" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">禁止（deny）は最優先</text>

  <defs>
    <marker id="dp-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>

  <rect x="40" y="80" width="180" height="60" rx="12" fill="#fff5f5" stroke="#e0554e" stroke-width="2"/>
  <text x="130" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#b23b34">deny 禁止</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#64748b">最優先</text>

  <line x1="222" y1="110" x2="256" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <rect x="270" y="80" width="180" height="60" rx="12" fill="#fdf1e3" stroke="#e0a24e" stroke-width="2"/>
  <text x="360" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#a56a1e">ask 確認</text>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#64748b">次に</text>

  <line x1="452" y1="110" x2="486" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <rect x="500" y="80" width="180" height="60" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="590" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#2f7d46">allow 許可</text>
  <text x="590" y="128" text-anchor="middle" font-size="11" fill="#64748b">最後に</text>

  <text x="360" y="176" text-anchor="middle" font-size="12" fill="#64748b">いったん禁止したものは、あとから許可で上書きされない。</text>
</svg>
