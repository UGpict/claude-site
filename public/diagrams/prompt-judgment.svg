<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" role="img" aria-label="AIに判断を任せる3つのコツ">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">AI に「判断」を任せる 3 つのコツ</text>

  <!-- card 1 -->
  <g>
    <rect x="30" y="80" width="200" height="180" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <circle cx="130" cy="118" r="18" fill="#2337ff"/>
    <text x="130" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">目的を伝える</text>
    <text x="130" y="186" text-anchor="middle" font-size="12" fill="#334155">「なぜしたいのか」を</text>
    <text x="130" y="204" text-anchor="middle" font-size="12" fill="#334155">一言そえる</text>
    <text x="130" y="234" text-anchor="middle" font-size="11" fill="#64748b">書き忘れを AI が補う</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="260" y="80" width="200" height="180" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <circle cx="360" cy="118" r="18" fill="#2337ff"/>
    <text x="360" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="360" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">具体語に開く</text>
    <text x="360" y="186" text-anchor="middle" font-size="12" fill="#334155">「いい感じ」をやめて</text>
    <text x="360" y="204" text-anchor="middle" font-size="12" fill="#334155">中身を言葉にする</text>
    <text x="360" y="234" text-anchor="middle" font-size="11" fill="#64748b">あいまいさを消す</text>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="490" y="80" width="200" height="180" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <circle cx="590" cy="118" r="18" fill="#2337ff"/>
    <text x="590" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="590" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">読者を決める</text>
    <text x="590" y="186" text-anchor="middle" font-size="12" fill="#334155">「誰が読むか」を</text>
    <text x="590" y="204" text-anchor="middle" font-size="12" fill="#334155">先に指定する</text>
    <text x="590" y="234" text-anchor="middle" font-size="11" fill="#64748b">言葉づかいが定まる</text>
  </g>
</svg>
