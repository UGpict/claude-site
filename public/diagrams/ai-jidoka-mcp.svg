<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="sans-serif" role="img" aria-label="MCPでつなぐ自動化。指揮役のAIが、共通の差込口MCPを通して、道具・別のAI・データを自分で呼び出す。">
  <rect width="720" height="220" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">MCP でつなぐと自分で呼べる</text>
  <defs>
    <marker id="jm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="24" y="82" width="160" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5"/>
  <text x="104" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">指揮役の AI</text>
  <text x="104" y="130" text-anchor="middle" font-size="11" fill="#64748b">Claude など</text>

  <line x1="186" y1="112" x2="220" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#jm-arrow)"/>

  <rect x="224" y="82" width="160" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="304" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">MCP</text>
  <text x="304" y="128" text-anchor="middle" font-size="11" fill="#64748b">共通の差込口</text>

  <line x1="386" y1="112" x2="420" y2="90" stroke="#2337ff" stroke-width="2" marker-end="url(#jm-arrow)"/>
  <line x1="386" y1="112" x2="420" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#jm-arrow)"/>
  <line x1="386" y1="112" x2="420" y2="134" stroke="#2337ff" stroke-width="2" marker-end="url(#jm-arrow)"/>

  <rect x="424" y="62" width="272" height="34" rx="9" fill="#f5f5f5" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="84" text-anchor="middle" font-size="12" fill="#334155">道具（ファイル・カレンダー等）</text>
  <rect x="424" y="103" width="272" height="34" rx="9" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="1.5"/>
  <text x="560" y="125" text-anchor="middle" font-size="12" fill="#2f7d46">別の AI（コーディング特化など）</text>
  <rect x="424" y="144" width="272" height="34" rx="9" fill="#f5f5f5" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="166" text-anchor="middle" font-size="12" fill="#334155">データ（社内の資料など）</text>

  <text x="360" y="204" text-anchor="middle" font-size="12" fill="#64748b">人がコピペしなくても、AIが必要なものを自分で取りにいける。</text>
</svg>
