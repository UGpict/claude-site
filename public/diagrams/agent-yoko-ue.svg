<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" role="img" aria-label="エージェントの二つの広がり。上に広がる＝Claudeとゲミニなどを使い分ける。横に広がる＝Gmail・カレンダー・Slackなど複数サービスをまたぐ。">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">「横」と「上」、二つの広がり</text>
  <defs>
    <marker id="yu-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <!-- 上：AIを使い分ける -->
  <text x="345" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">上：AIを使い分ける</text>
  <rect x="240" y="80" width="100" height="44" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="290" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">Claude</text>
  <rect x="350" y="80" width="100" height="44" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="400" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#000d8a">Gemini</text>

  <line x1="320" y1="180" x2="295" y2="126" stroke="#2337ff" stroke-width="2" marker-end="url(#yu-arrow)"/>
  <line x1="370" y1="180" x2="395" y2="126" stroke="#2337ff" stroke-width="2" marker-end="url(#yu-arrow)"/>

  <!-- 中心 -->
  <rect x="265" y="180" width="160" height="64" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2.5"/>
  <text x="345" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#2f7d46">AIエージェント</text>
  <text x="345" y="232" text-anchor="middle" font-size="11" fill="#334155">まとめ役</text>

  <!-- 横：サービスをまたぐ -->
  <text x="600" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">横：サービスをまたぐ</text>
  <rect x="515" y="82" width="175" height="46" rx="10" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="602" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Gmail</text>
  <rect x="515" y="146" width="175" height="46" rx="10" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="602" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">カレンダー</text>
  <rect x="515" y="210" width="175" height="46" rx="10" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/>
  <text x="602" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Slack</text>

  <line x1="425" y1="205" x2="509" y2="110" stroke="#2337ff" stroke-width="2" marker-end="url(#yu-arrow)"/>
  <line x1="425" y1="210" x2="509" y2="169" stroke="#2337ff" stroke-width="2" marker-end="url(#yu-arrow)"/>
  <line x1="425" y1="218" x2="509" y2="230" stroke="#2337ff" stroke-width="2" marker-end="url(#yu-arrow)"/>
</svg>
