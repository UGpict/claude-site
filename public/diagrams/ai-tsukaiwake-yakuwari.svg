<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" font-family="sans-serif" role="img" aria-label="役割で分けるAIの使い方。指揮役のAI（Claude）が段取り・執筆・確認を担い、コーディングは得意なAIに並列で任せる。">
  <rect width="720" height="264" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">役割で分ける</text>
  <defs>
    <marker id="ty-down" markerWidth="10" markerHeight="10" refX="4" refY="8" orient="auto"><path d="M0,0 L8,0 L4,9 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="250" y="60" width="220" height="66" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5"/>
  <text x="360" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#000d8a">指揮役の AI（Claude）</text>
  <text x="360" y="112" text-anchor="middle" font-size="12" fill="#334155">段取り・執筆・確認</text>

  <line x1="200" y1="176" x2="140" y2="132" stroke="#2337ff" stroke-width="2" marker-end="url(#ty-down)"/>
  <line x1="360" y1="176" x2="360" y2="132" stroke="#2337ff" stroke-width="2" marker-end="url(#ty-down)"/>
  <line x1="520" y1="176" x2="580" y2="132" stroke="#2337ff" stroke-width="2" marker-end="url(#ty-down)"/>
  <text x="360" y="152" text-anchor="middle" font-size="11" fill="#64748b">得意な仕事を任せる</text>

  <rect x="40" y="180" width="190" height="60" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="135" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">実装AI ①</text>
  <text x="135" y="226" text-anchor="middle" font-size="11" fill="#64748b">コーディング</text>

  <rect x="265" y="180" width="190" height="60" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="360" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">実装AI ②</text>
  <text x="360" y="226" text-anchor="middle" font-size="11" fill="#64748b">コーディング</text>

  <rect x="490" y="180" width="190" height="60" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="585" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">実装AI ③</text>
  <text x="585" y="226" text-anchor="middle" font-size="11" fill="#64748b">コーディング</text>
</svg>
