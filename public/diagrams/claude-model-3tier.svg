<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="sans-serif" role="img" aria-label="Claudeのモデルは3タイプ。Haikuは速くて軽い、Sonnetはバランス、Opusは賢くてじっくり。右にいくほど賢く、左にいくほど速く安い。">
  <rect width="720" height="240" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">モデルは大きく3タイプ</text>

  <rect x="30" y="70" width="200" height="96" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="130" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#2f7d46">Haiku</text>
  <text x="130" y="130" text-anchor="middle" font-size="12" fill="#334155">速い・軽い・安い</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#64748b">かんたんな用事に</text>

  <rect x="260" y="70" width="200" height="96" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="360" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#000d8a">Sonnet</text>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#334155">バランス型</text>
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#64748b">ふだん使いの定番</text>

  <rect x="490" y="70" width="200" height="96" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5"/>
  <text x="590" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#000d8a">Opus</text>
  <text x="590" y="130" text-anchor="middle" font-size="12" fill="#334155">いちばん賢い・じっくり</text>
  <text x="590" y="150" text-anchor="middle" font-size="11" fill="#64748b">難しい・重要な仕事に</text>

  <defs>
    <marker id="m3-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
  <line x1="40" y1="200" x2="680" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#m3-arrow)"/>
  <text x="60" y="222" text-anchor="start" font-size="12" fill="#64748b">速い・安い</text>
  <text x="660" y="222" text-anchor="end" font-size="12" fill="#64748b">賢い・じっくり</text>
</svg>
