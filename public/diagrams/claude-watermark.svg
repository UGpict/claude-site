<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="sans-serif" role="img" aria-label="見えない透かしのしくみ。Claudeが生成した文には見えない透かしが入り、コピペした先でも残る。透かしが示すのはAI製ということで、誰が使ったかではない。">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">「見えない透かし」はこう働く</text>

  <defs>
    <marker id="wm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/>
    </marker>
  </defs>

  <!-- left doc -->
  <rect x="34" y="70" width="250" height="120" rx="10" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text x="50" y="92" font-size="12" font-weight="700" fill="#000d8a">Claude が生成した文</text>
  <rect x="50" y="104" width="218" height="8" rx="4" fill="#e5e9f5"/>
  <rect x="50" y="120" width="200" height="8" rx="4" fill="#e5e9f5"/>
  <rect x="50" y="136" width="210" height="8" rx="4" fill="#e5e9f5"/>
  <rect x="50" y="158" width="150" height="20" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="1.5"/>
  <text x="125" y="172" text-anchor="middle" font-size="10" fill="#2f7d46">透かし入り（見えない）</text>

  <!-- arrow -->
  <line x1="288" y1="130" x2="428" y2="130" stroke="#2337ff" stroke-width="2" marker-end="url(#wm-arrow)"/>
  <text x="358" y="120" text-anchor="middle" font-size="11" fill="#334155">コピー &amp; ペースト</text>

  <!-- right doc -->
  <rect x="432" y="70" width="250" height="120" rx="10" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text x="448" y="92" font-size="12" font-weight="700" fill="#000d8a">貼り付けた先</text>
  <rect x="448" y="104" width="218" height="8" rx="4" fill="#e5e9f5"/>
  <rect x="448" y="120" width="200" height="8" rx="4" fill="#e5e9f5"/>
  <rect x="448" y="136" width="210" height="8" rx="4" fill="#e5e9f5"/>
  <rect x="448" y="158" width="150" height="20" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="1.5"/>
  <text x="523" y="172" text-anchor="middle" font-size="10" fill="#2f7d46">透かしは残る</text>

  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#64748b">透かしが示すのは「AI（Claude）が作った」こと。</text>
  <text x="360" y="246" text-anchor="middle" font-size="12" fill="#64748b">「誰が使ったか」を示すものではありません。</text>
</svg>
