<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="sans-serif" role="img" aria-label="AIエージェントの動き方。目標を受け取り、計画を立て、実行し、確認する。できるまでこのループを自分で繰り返す。">
  <rect width="720" height="220" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">AIエージェントの動き方</text>
  <defs>
    <marker id="al-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="30" y="80" width="150" height="64" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="105" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">目標を受け取る</text>

  <line x1="182" y1="112" x2="196" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#al-arrow)"/>

  <rect x="200" y="80" width="150" height="64" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="275" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">計画を立てる</text>

  <line x1="352" y1="112" x2="366" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#al-arrow)"/>

  <rect x="370" y="80" width="150" height="64" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="445" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">実行する</text>

  <line x1="522" y1="112" x2="536" y2="112" stroke="#2337ff" stroke-width="2" marker-end="url(#al-arrow)"/>

  <rect x="540" y="80" width="150" height="64" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
  <text x="615" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d46">確認する</text>

  <path d="M615,146 L615,186 L275,186 L275,148" fill="none" stroke="#2337ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#al-arrow)"/>
  <text x="445" y="180" text-anchor="middle" font-size="12" fill="#64748b">できるまで、自分で繰り返す</text>
</svg>
