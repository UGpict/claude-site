<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="sans-serif" role="img" aria-label="Claude Codeと上手に付き合う5つのコツ。ゴールを具体的に・まず計画・小さくこまめに・テストもセットで・過信しない。">
  <rect width="720" height="200" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">上手に付き合う 5 つのコツ</text>
  <g font-size="12" fill="#334155">
    <g><rect x="16" y="64" width="132" height="112" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><circle cx="82" cy="92" r="15" fill="#2337ff"/><text x="82" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="82" y="128" text-anchor="middle" font-weight="700" fill="#000d8a">ゴールを</text><text x="82" y="145" text-anchor="middle" font-weight="700" fill="#000d8a">具体的に</text></g>
    <g><rect x="156" y="64" width="132" height="112" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><circle cx="222" cy="92" r="15" fill="#2337ff"/><text x="222" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="222" y="128" text-anchor="middle" font-weight="700" fill="#000d8a">まず計画を</text><text x="222" y="145" text-anchor="middle" font-weight="700" fill="#000d8a">立てさせる</text></g>
    <g><rect x="296" y="64" width="132" height="112" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><circle cx="362" cy="92" r="15" fill="#2337ff"/><text x="362" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="362" y="128" text-anchor="middle" font-weight="700" fill="#000d8a">小さく</text><text x="362" y="145" text-anchor="middle" font-weight="700" fill="#000d8a">こまめに</text></g>
    <g><rect x="436" y="64" width="132" height="112" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><circle cx="502" cy="92" r="15" fill="#2337ff"/><text x="502" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="502" y="128" text-anchor="middle" font-weight="700" fill="#000d8a">テストも</text><text x="502" y="145" text-anchor="middle" font-weight="700" fill="#000d8a">セットで</text></g>
    <g><rect x="576" y="64" width="128" height="112" rx="10" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/><circle cx="640" cy="92" r="15" fill="#3f9e5a"/><text x="640" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="640" y="128" text-anchor="middle" font-weight="700" fill="#2f7d46">過信</text><text x="640" y="145" text-anchor="middle" font-weight="700" fill="#2f7d46">しない</text></g>
  </g>
</svg>
