<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="sans-serif" role="img" aria-label="上に広がる。まとめ役のAIが、得意なAIに得意な仕事を振る。文章やコードはClaude、画像や検索はGeminiに任せる。">
  <rect width="720" height="230" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1219">得意なAIに、得意な仕事を振る</text>
  <defs>
    <marker id="ue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2337ff"/></marker>
  </defs>

  <rect x="270" y="58" width="180" height="60" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2.5"/>
  <text x="360" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#2f7d46">まとめ役のAI</text>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="#334155">仕事を振り分ける</text>

  <line x1="330" y1="120" x2="240" y2="152" stroke="#2337ff" stroke-width="2" marker-end="url(#ue-arrow)"/>
  <line x1="390" y1="120" x2="480" y2="152" stroke="#2337ff" stroke-width="2" marker-end="url(#ue-arrow)"/>

  <rect x="110" y="156" width="230" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="225" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">Claude</text>
  <text x="225" y="204" text-anchor="middle" font-size="11" fill="#64748b">文章・コードが得意</text>

  <rect x="380" y="156" width="230" height="60" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="495" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">Gemini</text>
  <text x="495" y="204" text-anchor="middle" font-size="11" fill="#64748b">画像・検索が得意</text>
</svg>
