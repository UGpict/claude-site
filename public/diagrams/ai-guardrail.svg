<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" role="img" aria-label="KangaLがかけた4つの制限。実弾を作らせない・回数に上限・見る情報を絞る・危険機能は普段オフ。">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1219">KangaL がかけた「制限」</text>

  <!-- card 1 -->
  <g>
    <rect x="16" y="78" width="160" height="188" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <circle cx="96" cy="116" r="17" fill="#3f9e5a"/>
    <text x="96" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="96" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">実弾を</text>
    <text x="96" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">作らせない</text>
    <text x="96" y="206" text-anchor="middle" font-size="11" fill="#64748b">本物の詐欺文でなく</text>
    <text x="96" y="222" text-anchor="middle" font-size="11" fill="#64748b">「型」だけ進化</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="192" y="78" width="160" height="188" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <circle cx="272" cy="116" r="17" fill="#3f9e5a"/>
    <text x="272" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="272" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">回数に上限</text>
    <text x="272" y="188" text-anchor="middle" font-size="11" fill="#64748b">自己改善ループを</text>
    <text x="272" y="204" text-anchor="middle" font-size="11" fill="#64748b">無限に回さない</text>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="368" y="78" width="160" height="188" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <circle cx="448" cy="116" r="17" fill="#3f9e5a"/>
    <text x="448" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text x="448" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">見る情報を絞る</text>
    <text x="448" y="188" text-anchor="middle" font-size="11" fill="#64748b">公的機関の</text>
    <text x="448" y="204" text-anchor="middle" font-size="11" fill="#64748b">公開情報だけ</text>
  </g>

  <!-- card 4 -->
  <g>
    <rect x="544" y="78" width="160" height="188" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <circle cx="624" cy="116" r="17" fill="#3f9e5a"/>
    <text x="624" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
    <text x="624" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">危険機能は</text>
    <text x="624" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d46">普段オフ</text>
    <text x="624" y="206" text-anchor="middle" font-size="11" fill="#64748b">攻撃 AI はデモ時</text>
    <text x="624" y="222" text-anchor="middle" font-size="11" fill="#64748b">だけ動かす</text>
  </g>
</svg>
