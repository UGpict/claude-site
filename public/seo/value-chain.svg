<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="sans-serif" role="img" aria-label="検索から受注・口座開設までの一気通貫">
  <rect width="720" height="200" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1219">検索から受注まで、一本でつながった</text>
  <defs><marker id="vc" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2337ff"/></marker></defs>
  <g font-size="12.5">
    <g><rect x="18" y="76" width="118" height="64" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><text x="77" y="104" text-anchor="middle" font-weight="700" fill="#000d8a">検索で発見</text><text x="77" y="124" text-anchor="middle" fill="#64748b">SEO / 生成AI</text></g>
    <line x1="138" y1="108" x2="160" y2="108" stroke="#2337ff" stroke-width="2" marker-end="url(#vc)"/>
    <g><rect x="162" y="76" width="110" height="64" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><text x="217" y="112" text-anchor="middle" font-weight="700" fill="#000d8a">問い合わせ</text></g>
    <line x1="274" y1="108" x2="296" y2="108" stroke="#2337ff" stroke-width="2" marker-end="url(#vc)"/>
    <g><rect x="298" y="76" width="100" height="64" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><text x="348" y="112" text-anchor="middle" font-weight="700" fill="#000d8a">商談</text></g>
    <line x1="400" y1="108" x2="422" y2="108" stroke="#2337ff" stroke-width="2" marker-end="url(#vc)"/>
    <g><rect x="424" y="76" width="100" height="64" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/><text x="474" y="112" text-anchor="middle" font-weight="700" fill="#000d8a">受注</text></g>
    <line x1="526" y1="108" x2="548" y2="108" stroke="#2337ff" stroke-width="2" marker-end="url(#vc)"/>
    <g><rect x="550" y="76" width="152" height="64" rx="10" fill="#2337ff"/><text x="626" y="104" text-anchor="middle" font-weight="700" fill="#ffffff">新規取引口座</text><text x="626" y="124" text-anchor="middle" fill="#dfe4ff">が開く</text></g>
  </g>
  <text x="360" y="176" text-anchor="middle" font-size="13" fill="#64748b">コネや既存の関係に頼らず、検索という入り口だけで最後まで到達した</text>
</svg>
