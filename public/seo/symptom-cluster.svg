<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="sans-serif" role="img" aria-label="症状ベースのコンテンツクラスター">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1219">症状ごとに「一番詳しい」を作る</text>

  <line x1="360" y1="90" x2="200" y2="150" stroke="#c7d0e6" stroke-width="2"/>
  <line x1="360" y1="90" x2="520" y2="150" stroke="#c7d0e6" stroke-width="2"/>
  <line x1="360" y1="90" x2="360" y2="150" stroke="#c7d0e6" stroke-width="2"/>

  <g>
    <rect x="250" y="60" width="220" height="52" rx="12" fill="#2337ff"/>
    <text x="360" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">断面研磨・分析</text>
    <text x="360" y="102" text-anchor="middle" font-size="12" fill="#dfe4ff">削って断面を見て原因を突き止める</text>
  </g>

  <g font-size="13">
    <rect x="70" y="150" width="200" height="86" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2.5"/>
    <text x="170" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#2f7d46">割れ（クラック）</text>
    <text x="170" y="206" text-anchor="middle" fill="#4b7a5b">主要な入り口①</text>
    <text x="170" y="224" text-anchor="middle" fill="#64748b">樹脂の割れ・欠け</text>

    <rect x="290" y="150" width="140" height="86" rx="12" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="360" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#000d8a">削りにくい部品</text>
    <text x="360" y="208" text-anchor="middle" fill="#64748b">相談が来やすい</text>

    <rect x="450" y="150" width="200" height="86" rx="12" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2.5"/>
    <text x="550" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#2f7d46">樹脂埋めと硬化</text>
    <text x="550" y="206" text-anchor="middle" fill="#4b7a5b">主要な入り口②</text>
    <text x="550" y="224" text-anchor="middle" fill="#64748b">埋め方・気泡対策</text>
  </g>
  <text x="360" y="264" text-anchor="middle" font-size="13" fill="#64748b">検索ボリュームの大きさより、困っている当事者への刺さり方を優先した</text>
</svg>
