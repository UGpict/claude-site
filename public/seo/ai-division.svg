<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" role="img" aria-label="人間とAIの分業">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1219">効いたのは「集客の文法 × AI の実装」</text>

  <g>
    <rect x="30" y="66" width="310" height="150" rx="14" fill="#e9f6ec" stroke="#3f9e5a" stroke-width="2"/>
    <text x="185" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#2f7d46">人間（自分）が持っていたもの</text>
    <g font-size="14" fill="#33553f">
      <text x="55" y="130">・誰に何を届けるかの設計</text>
      <text x="55" y="158">・症状ベースのコンテンツ判断</text>
      <text x="55" y="186">・成果を数字で見る習慣（SEO/CVR）</text>
    </g>
  </g>
  <text x="360" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#94a3b8">×</text>
  <g>
    <rect x="380" y="66" width="310" height="150" rx="14" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
    <text x="535" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#000d8a">AI に肩代わりしてもらったもの</text>
    <g font-size="14" fill="#334155">
      <text x="405" y="130">・コードの実装（React / Next.js）</text>
      <text x="405" y="158">・型チェックでの間違い早期発見</text>
      <text x="405" y="186">・部品単位の生成と手直し</text>
    </g>
  </g>
  <text x="360" y="240" text-anchor="middle" font-size="13" fill="#64748b">コードが書けるようになったのではない。集客の文法を持つ人間が、コードの壁を AI で越えた</text>
</svg>
